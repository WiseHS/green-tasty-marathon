services:
  - type: web
    name: green-tasty-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: backend/Restaurant.Web/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SIGNING_KEY
        generateValue: true
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ASPNETCORE_HTTP_PORTS
        value: "8080"
  - type: web
    name: green-tasty-marathon
    runtime: static
    rootDir: frontend/restaurant-frontend-app
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: dist/restaurant-frontend-app/browser
    envVars:
      - key: NODE_VERSION
        value: 24.22.2
      - key: BACKEND_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
